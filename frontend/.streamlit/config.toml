# Tema — aparência moderna, limpa e profissional (azul escuro / branco / cinza).
[theme]
base = "light"
primaryColor = "#1E4E79"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#1B2733"
font = "sans serif"

[client]
# Navegação é controlada por st.navigation (evita menu automático duplicado).
showSidebarNavigation = false

[server]
headless = true

[browser]
gatherUsageStats = false
