[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-prompt-agent"
version = "0.1.0"
description = "Laboratório experimental de Engenharia de Prompt aplicada a agentes financeiros."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["app", "experiments"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
